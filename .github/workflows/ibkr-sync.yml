name: Sync IBKR positions (encrypted)

on:
  schedule:
    # IBKR's "last business day" statement is ready the next morning. Tue-Sat covers Mon-Fri trading.
    - cron: "23 1 * * 2-6"    # 09:23 Hong Kong
    - cron: "23 12 * * 2-6"   # 20:23 Hong Kong (backup)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  TOKEN_EXPIRES: "2027-10-17"   # the Flex token's end date; update it when you make a new token

concurrency:
  group: market-data          # shares the data folder with the market job, so commits don't collide
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet cryptography
      - name: Fetch positions and save them encrypted
        id: sync
        env:
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
          PLAN_SYNC_KEY: ${{ secrets.PLAN_SYNC_KEY }}
        run: python scripts/ibkr_sync.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/ibkr.enc.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update encrypted IBKR positions"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
      - name: Remind before the token expires (Mondays, from 30 days before)
        if: always() && github.event.schedule == '23 1 * * 2-6'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          left=$(( ( $(date -d "$TOKEN_EXPIRES" +%s) - $(date +%s) ) / 86400 ))
          [ "$left" -le 30 ] && [ "$(TZ=Asia/Hong_Kong date +%u)" = "2" ] || exit 0
          printf 'Your IBKR Flex token expires on %s (%s days). In IBKR: Performance & Reports → Flex Queries → Flex Web Service → generate a new token, then replace the IBKR_FLEX_TOKEN secret in GitHub and update TOKEN_EXPIRES in .github/workflows/ibkr-sync.yml.\n' "$TOKEN_EXPIRES" "$left" > body.md
          bash scripts/notify.sh "IBKR token expires in $left days" "Make a new Flex token and replace the IBKR_FLEX_TOKEN secret in GitHub." default key "IBKR token expires $TOKEN_EXPIRES" body.md
      - name: Tell you if the sync fails
        if: failure() && steps.sync.outcome == 'failure' && (github.event.schedule == '23 12 * * 2-6' || github.event_name == 'workflow_dispatch')
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] && curl -fsS --retry 4 --retry-delay 10 -H "Title: IBKR sync failed" -H "Priority: default" -H "Tags: warning" \
            -H "Click: $RUN" -d "Today's IBKR sync failed (expired token or IBKR busy). Tap to see the error." "https://ntfy.sh/$NTFY_TOPIC" || true
