name: One-off S&P momentum index history
on:
  push:
    paths: [".github/workflows/probe-spmom2.yml"]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          python3 - <<'PY'
          import urllib.request, urllib.parse, json
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          log = []
          for s in ["^SP500MUP", "^SP500MUN", "^SP500MUT", "^SPXMOMT", "^SP500MOM", "^SPXT", "^GSPC", "^SP500TR"]:
              for q in ["range=max&interval=1d", "range=max&interval=1mo", "period1=631152000&period2=1793000000&interval=1d"]:
                  try:
                      r = json.load(urllib.request.urlopen(urllib.request.Request(f"https://query1.finance.yahoo.com/v8/finance/chart/{urllib.parse.quote(s)}?{q}", headers=UA), timeout=60))["chart"]["result"][0]
                      n = len(r.get("timestamp") or [])
                      log.append(f"{s} [{q[:14]}]: {n} rows, first {r['timestamp'][0] if n else None}, name {r['meta'].get('longName') or r['meta'].get('shortName')}")
                      if n > 100:
                          json.dump({"t": r["timestamp"], "c": r["indicators"]["quote"][0]["close"]}, open(f"probe/{s.strip('^')}_{q[:5].replace('=','')}.json", "w")); break
                  except Exception as e: log.append(f"{s} [{q[:14]}]: {e!r}")
          open("probe/logsp2.txt", "w").write("\n".join(log))
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "spmom2 probe" && git pull --rebase && git push
