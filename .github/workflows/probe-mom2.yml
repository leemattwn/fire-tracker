name: One-off momentum fund prices
on:
  push:
    paths: [".github/workflows/probe-mom2.yml"]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          python3 - <<'PY'
          import urllib.request, json, time
          UA = {"User-Agent": "Mozilla/5.0 (fire-tracker probe)"}
          log = []
          def get(url): return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60))
          syms = ["IUMO.L", "IUMF.L", "IWMO.L", "IWFM.L", "XDEM.L", "XDEM.DE", "IS3R.DE", "MTUM", "SPMO", "GBPUSD=X", "EURUSD=X", "CSPX.L", "AVUV", "AVGS.L"]
          for isin in ["IE0001FQFU60", "IE000TL3PL69", "IE00BD1F4N50", "IE00BL25JP72"]:
              try:
                  q = get(f"https://query2.finance.yahoo.com/v1/finance/search?q={isin}&quotesCount=10")["quotes"]
                  log.append(f"{isin}: " + ", ".join(x.get("symbol", "") + "/" + x.get("exchange", "") for x in q))
                  syms += [x["symbol"] for x in q if x.get("symbol") and x["symbol"] not in syms]
              except Exception as e: log.append(f"{isin}: {e!r}")
          for sym in syms:
              try:
                  res = get(f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}?period1=0&period2={int(time.time())}&interval=1d")["chart"]["result"][0]
                  json.dump({"t": res["timestamp"], "adj": res["indicators"]["adjclose"][0]["adjclose"], "close": res["indicators"]["quote"][0]["close"], "cur": res["meta"].get("currency")}, open(f"probe/{sym}.json", "w"))
                  log.append(f"{sym}: ok {len(res['timestamp'])} days {res['meta'].get('currency')}")
              except Exception as e: log.append(f"{sym}: {e!r}")
              time.sleep(1)
          open("probe/log2.txt", "w").write("\n".join(log))
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "momentum fund probe" && git pull --rebase && git push
