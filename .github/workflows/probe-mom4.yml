name: One-off MSCI momentum history
on:
  push:
    paths: [".github/workflows/probe-mom4.yml"]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          python3 - <<'PY'
          import urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36", "Accept": "*/*"}
          log = []
          for var in ["NETR", "GRTR"]:
              for code in ["703025", "703755", "984000", "990100"]:
                  url = f"https://app2.msci.com/products/service/index/indexmaster/getLevelDataForGraph?currency_symbol=USD&index_variant={var}&start_date=19970101&end_date=20261027&data_frequency=DAILY&baseValue=false&index_codes={code}"
                  try:
                      raw = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=120).read()
                      open(f"probe/msci_{code}_{var}.json", "wb").write(raw); log.append(f"{code} {var}: ok {len(raw)} bytes")
                  except Exception as e: log.append(f"{code} {var}: {e!r}")
          open("probe/log4.txt", "w").write("\n".join(log))
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "msci probe" && git pull --rebase && git push
