name: Check phone notification delivery (one-off)
on:
  push:
    paths: [".github/workflows/probe-ntfy.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          mkdir -p probe
          # What the ntfy server holds for your topic in the last 2 hours (titles and times only, never the topic name)
          curl -fsS "https://ntfy.sh/$NTFY_TOPIC/json?poll=1&since=2h" | python3 -c "
          import sys, json, datetime
          rows = [json.loads(l) for l in sys.stdin if l.strip()]
          print(f'{len(rows)} message(s) on the server for your topic in the last 2 hours')
          for r in rows: print(datetime.datetime.utcfromtimestamp(r['time']).isoformat(), '|', r.get('title'), '|', r.get('message'))
          " > probe/ntfy.txt
          echo "topic length: ${#NTFY_TOPIC}; starts with: ${NTFY_TOPIC:0:15}; has spaces: $([[ "$NTFY_TOPIC" =~ [[:space:]] ]] && echo yes || echo no)" >> probe/ntfy.txt
          curl -fsS -H "Title: Test 2: notifications work" -H "Priority: high" -H "Tags: white_check_mark" -H "Click: $SITE" \
            -d "Second test from your investment plan." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null && echo "sent test 2" >> probe/ntfy.txt
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add probe/ntfy.txt && git commit -m "ntfy check" && git pull --rebase && git push
