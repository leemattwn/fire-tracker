name: Monthly buy reminder

on:
  schedule:
    # Runs a few times a day around the 15th; scripts/buy_day.py decides whether today is the day before the buy day
    # (the 15th, or the next day New York and London are both open). Only the first successful run each month sends anything.
    - cron: "7 1 13-20 * *"    # 09:07 Hong Kong
    - cron: "37 4 13-20 * *"   # 12:37 Hong Kong (backup)
    - cron: "7 11 13-20 * *"   # 19:07 Hong Kong (backup)
    - cron: "7 23 13-20 * *"   # 07:07 Hong Kong next morning (last chance, on the buy day itself)
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send this month's reminder once (phone + email)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          read -r BUY WHAT < <(python3 scripts/buy_day.py | paste -sd' ')
          if [ "$WHAT" != "send" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Buy day is $BUY; not reminder day yet"; exit 0
          fi
          MONTH=$(TZ=Asia/Hong_Kong date +'%B %Y')
          if [ -n "$(gh issue list --state all --search "\"Monthly buy: $MONTH\" in:title" --json number --jq '.[].number')" ]; then
            echo "Already sent for $MONTH"; exit 0
          fi
          for n in $(gh issue list --state open --search "Monthly buy in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --reason completed || true
          done
          TODAY=$(TZ=Asia/Hong_Kong date +%F)
          DAYNAME=$(date -d "$BUY" +'%A %-d %b')
          if [ "$BUY" = "$TODAY" ]; then WHEN="today ($DAYNAME)"; else WHEN="tomorrow ($DAYNAME)"; fi
          NOTE=""
          if [ "$(date -d "$BUY" +%d)" != "15" ]; then NOTE=" The 15th falls on a weekend or market holiday this month, so buy on the next trading day."; fi
          printf '@%s Your monthly buy is %s.%s\n\n1. Open the tracker: %s\n2. Do anything in the **To do** box first (rebalance, signal switch or moving to Irish funds).\n3. Buy the fund it shows, then tap **I bought it**.\n' "$OWNER" "$WHEN" "$NOTE" "$SITE" > body.md
          bash scripts/notify.sh "Monthly buy $WHEN" "Open the tracker, do anything in To do first, then buy the fund it shows and tap I bought it.$NOTE" default calendar "Monthly buy: $MONTH" body.md
