name: One-off international factor download
on:
  push:
    paths: [".github/workflows/probe-intl.yml"]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          python3 - <<'PY'
          import urllib.request, zipfile, io
          UA = {"User-Agent": "Mozilla/5.0 (fire-tracker probe)"}
          base = "https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/"
          names = []
          for reg in ["Developed_ex_US", "Developed", "Emerging", "Emerging_Markets", "Europe", "Japan", "Asia_Pacific_ex_Japan", "North_America"]:
              for kind in ["6_Portfolios_ME_BE-ME", "6_Portfolios_ME_Prior_12_2", "6_Portfolios_ME_OP", "6_Portfolios_ME_BE-ME_daily", "6_Portfolios_ME_Prior_250_20_daily", "6_Portfolios_ME_OP_daily", "5_Factors", "Mom_Factor"]:
                  names.append(f"{reg}_{kind}")
          log = []
          for n in names:
              try:
                  raw = urllib.request.urlopen(urllib.request.Request(base + n + "_CSV.zip", headers=UA), timeout=60).read()
                  z = zipfile.ZipFile(io.BytesIO(raw)); open("probe/" + n + ".csv", "wb").write(z.read(z.namelist()[0])); log.append(f"{n}: ok {len(raw)}")
              except Exception as e: log.append(f"{n}: {type(e).__name__} {getattr(e, 'code', '')}")
          open("probe/logi.txt", "w").write("\n".join(log))
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "intl probe" && git pull --rebase && git push
