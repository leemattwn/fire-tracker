name: Research - insider buying data (branch only)
on:
  push:
    branches: [alpha-insider]
    paths: [".github/workflows/alpha-insider.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          u=https://www.sec.gov/files/structureddata/data/insider-transactions-data-sets/2024q1_form345.zip
          {
          for ua in "Matt Lee leemattwn@users.noreply.github.com" "Research Project research@example.com" "Mozilla/5.0"; do
            echo "UA=$ua -> $(curl -s -o /dev/null -w '%{http_code} %{size_download}' -A "$ua" "$u")"
          done
          echo "edgar page -> $(curl -s -o /dev/null -w '%{http_code}' -A 'Research Project research@example.com' https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent)"
          echo "efts api -> $(curl -s -o /dev/null -w '%{http_code}' -A 'Research Project research@example.com' 'https://efts.sec.gov/LATEST/search-index?q=%22form%204%22')"
          echo "data.sec.gov -> $(curl -s -o /dev/null -w '%{http_code}' -A 'Research Project research@example.com' https://data.sec.gov/submissions/CIK0000320193.json)"
          echo "body sample:"; curl -s -A "Mozilla/5.0" "$u" | head -c 400
          } > research/probe.txt 2>&1
          git config user.name bot; git config user.email bot@x
          git add research/probe.txt && git commit -m probe && git push
