name: One-off factor portfolio download
on:
  push:
    paths: [".github/workflows/probe-ff5.yml"]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          python3 - <<'PY'
          import urllib.request, zipfile, io
          UA = {"User-Agent": "Mozilla/5.0 (fire-tracker probe)"}
          base = "https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/"
          names = ["6_Portfolios_ME_OP_2x3_daily", "6_Portfolios_ME_INV_2x3_daily", "6_Portfolios_2x3_daily", "F-F_Research_Data_5_Factors_2x3_daily",
                   "Portfolios_Formed_on_VAR_daily", "Portfolios_Formed_on_VAR", "Portfolios_Formed_on_BETA", "25_Portfolios_BEME_OP_5x5_daily",
                   "32_Portfolios_ME_BEME_OP_2x4x4", "25_Portfolios_ME_OP_5x5_daily", "25_Portfolios_5x5_Daily"]
          log = []
          for n in names:
              try:
                  raw = urllib.request.urlopen(urllib.request.Request(base + n + "_CSV.zip", headers=UA), timeout=120).read()
                  z = zipfile.ZipFile(io.BytesIO(raw)); open("probe/" + n + ".csv", "wb").write(z.read(z.namelist()[0])); log.append(f"{n}: ok {len(raw)}")
              except Exception as e: log.append(f"{n}: {e!r}")
          open("probe/log5.txt", "w").write("\n".join(log))
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "factor probe" && git pull --rebase && git push
