name: tmp-prices
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL --http1.1 --retry 3 -A "Mozilla/5.0 (X11; Linux x86_64)" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=UNRATE" -o fred.csv || true
          if [ -s fred.csv ] && head -1 fred.csv | grep -qi date; then sed 's/^/ROW /' fred.csv; exit 0; fi
          echo "FRED failed; trying BLS"
          for s in 1948 1958 1968 1978 1988 1998 2008 2018; do
            e=$((s+9)); curl -sS --retry 3 -H 'Content-Type: application/json' -X POST -d "{\"seriesid\":[\"LNS14000000\"],\"startyear\":\"$s\",\"endyear\":\"$e\"}" https://api.bls.gov/publicAPI/v1/timeseries/data/ \
              | python3 -c "import json,sys; d=json.load(sys.stdin); [print(f'ROW {x[\"year\"]}-{x[\"period\"][1:]}-01,{x[\"value\"]}') for x in d['Results']['series'][0]['data'] if x['period'].startswith('M') and x['period']!='M13']" || echo "BLS $s failed"
            sleep 2
          done
