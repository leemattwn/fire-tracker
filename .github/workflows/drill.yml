name: Alert drill (one-off)
on:
  push:
    paths: [".github/workflows/drill.yml"]
permissions:
  issues: write
jobs:
  drill:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - name: Signal alert through the real sender
        run: |
          printf '@%s [DRILL] This is how a real signal alert arrives. Nothing has changed: the signal is still ON.\n' "$OWNER" > body.md
          bash scripts/notify.sh "[DRILL] Signal OFF (test)" "Sell your small-value funds (AVUV, AVGS) and buy IB01, if they total over US\$1,500. The tracker's To do box shows the exact trades." high chart_with_downwards_trend "[DRILL] Signal OFF" body.md
      - name: Monthly reminder through the real sender
        run: |
          printf '@%s [DRILL] This is how the monthly reminder arrives.\n' "$OWNER" > body.md
          bash scripts/notify.sh "[DRILL] Monthly buy tomorrow (15th)" "Open the tracker, do anything in To do first, then buy the fund it shows and tap I bought it." default calendar "[DRILL] Monthly buy reminder" body.md
      - name: Close the drill issues
        if: always()
        run: for n in $(gh issue list --state open --search "[DRILL] in:title" --json number --jq '.[].number'); do gh issue close "$n" --reason completed; done
