name: Test the alert emails (one-off)
on:
  push:
    paths: [".github/workflows/test-emails.yml"]
permissions:
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - name: Same message as a real signal flip, marked as a test
        env:
          FLIP: "OFF"
          WHEN: "TEST"
          DETAIL: "This is a test of the signal alert. Nothing has changed: the signal is still ON."
        run: |
          ACTION="Sell your small-value funds (AVUV, AVGS) and buy IB01. While you're studying, only if your small-value funds are over US\$1,500."
          printf '@%s The market signal turned **%s** at the close on %s.\n\n%s\n\n**What to do:** %s\n\nOpen the tracker: %s\n' \
            "$OWNER" "$FLIP" "$WHEN" "$DETAIL" "$ACTION" "$SITE" > body.md
          gh issue create --title "TEST: Signal $FLIP alert" --body-file body.md
      - name: Same message as the monthly reminder, marked as a test
        run: |
          MONTH=$(TZ=Asia/Hong_Kong date +'%B %Y')
          printf '@%s Tomorrow (the 15th) is your monthly buy.\n\n1. Open the tracker: %s\n2. Do anything in the **To do** box first (rebalance, signal switch or moving to Irish funds).\n3. Buy the fund it shows, then tap **I bought it**.\n\n_(This is a test.)_\n' "$OWNER" "$SITE" > body.md
          gh issue create --title "TEST: Monthly buy: $MONTH" --body-file body.md
