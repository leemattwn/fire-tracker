name: One-off momentum data download
on:
  push:
    paths: [".github/workflows/probe-mom.yml"]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          python3 - <<'PY'
          import urllib.request, zipfile, io, json, time
          UA = {"User-Agent": "Mozilla/5.0 (fire-tracker probe)"}
          base = "https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/"
          log = []
          for f in ["6_Portfolios_ME_Prior_12_2_Daily_CSV.zip", "10_Portfolios_Prior_12_2_Daily_CSV.zip", "F-F_Momentum_Factor_daily_CSV.zip"]:
              try:
                  raw = urllib.request.urlopen(urllib.request.Request(base + f, headers=UA), timeout=120).read()
                  z = zipfile.ZipFile(io.BytesIO(raw)); name = z.namelist()[0]
                  open("probe/" + f.replace("_CSV.zip", ".csv"), "wb").write(z.read(name)); log.append(f"{f}: ok {len(raw)} bytes")
              except Exception as e: log.append(f"{f}: {e!r}")
          for sym in ["MTUM", "IWMO.L", "SPY"]:
              try:
                  url = f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}?period1=0&period2={int(time.time())}&interval=1d"
                  res = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60))["chart"]["result"][0]
                  json.dump({"t": res["timestamp"], "adj": res["indicators"]["adjclose"][0]["adjclose"], "cur": res["meta"].get("currency")}, open(f"probe/{sym}.json", "w"))
                  log.append(f"{sym}: ok {len(res['timestamp'])} days")
              except Exception as e: log.append(f"{sym}: {e!r}")
          open("probe/log.txt", "w").write("\n".join(log))
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "momentum probe" && git pull --rebase && git push
