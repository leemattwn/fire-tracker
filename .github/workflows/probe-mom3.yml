name: One-off momentum index history
on:
  push:
    paths: [".github/workflows/probe-mom3.yml"]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          python3 - <<'PY'
          import urllib.request, zipfile, io
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36", "Accept": "*/*"}
          log = []
          def get(url): return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=120).read()
          jobs = {
            "aqr_mom.xlsx": "https://www.aqr.com/-/media/AQR/Documents/Insights/Data-Sets/Momentum-Indices-Monthly.xlsx",
            "msci_d.json": "https://app2.msci.com/products/service/index/indexmaster/getLevelDataForGraph?currency_symbol=USD&index_variant=NETR&start_date=19691231&end_date=20261027&data_frequency=DAILY&baseValue=false&index_codes=703025,703755,984000,990100",
            "msci_m.json": "https://app2.msci.com/products/service/index/indexmaster/getLevelDataForGraph?currency_symbol=USD&index_variant=GRTR&start_date=19691231&end_date=20261027&data_frequency=END_OF_MONTH&baseValue=false&index_codes=703025,703755,984000,990100",
            "msci_page.html": "https://www.msci.com/indexes/index/703025",
          }
          base = "https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/"
          for f in ["Developed_ex_US_6_Portfolios_ME_Prior_12_2_Daily_CSV.zip", "Developed_6_Portfolios_ME_Prior_12_2_Daily_CSV.zip", "25_Portfolios_ME_Prior_12_2_Daily_CSV.zip"]:
              jobs[f.replace("_CSV.zip", ".csv")] = base + f
          for name, url in jobs.items():
              try:
                  raw = get(url)
                  if url.endswith(".zip"):
                      z = zipfile.ZipFile(io.BytesIO(raw)); raw = z.read(z.namelist()[0])
                  open("probe/" + name, "wb").write(raw); log.append(f"{name}: ok {len(raw)} bytes")
              except Exception as e: log.append(f"{name}: {e!r}")
          open("probe/log3.txt", "w").write("\n".join(log))
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "momentum index probe" && git pull --rebase && git push
