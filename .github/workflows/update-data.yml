name: Update market data

on:
  schedule:
    - cron: "17 7-20 * * 1-5" # hourly while London or New York is open (15:17-04:17 Hong Kong)
    - cron: "35 21 * * 1-5"   # 05:35 Hong Kong, after the US close
    - cron: "50 16 * * 1-5"   # 00:50 Hong Kong, after the London close
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_data.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # latest data, not the commit from when the run was queued
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices and compute the signal
        id: data
        run: python scripts/update_data.py
      - name: Send the signal alert (phone + email); retried every run until it gets through
        if: steps.data.outputs.flip != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FLIP: ${{ steps.data.outputs.flip }}
          WHEN: ${{ steps.data.outputs.date }}
          DETAIL: ${{ steps.data.outputs.detail }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          OWNER: ${{ github.repository_owner }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "$FLIP" = "OFF" ]; then
            ACTION="Both the S&P 500 and AVGS closed below their 150-day averages. Sell your small-value funds (AVUV, AVGS) and buy IB01, if they total over US\$1,500. The tracker's To do box shows the exact trades."
            TAGS=chart_with_downwards_trend
          else
            ACTION="The S&P 500 or AVGS is back above its 150-day average. Sell your parked IB01 and buy back small value (the tracker shows which fund)."
            TAGS=chart_with_upwards_trend
          fi
          printf '@%s The market signal turned **%s** at the close on %s.\n\n%s\n\n**What to do:** %s\n\nOpen the tracker: %s\n' \
            "$OWNER" "$FLIP" "$WHEN" "$DETAIL" "$ACTION" "$SITE" > body.md
          bash scripts/notify.sh "Signal $FLIP ($WHEN close)" "$ACTION" high "$TAGS" "Signal $FLIP on $WHEN" body.md
          python3 -c "import json; p='data/market.json'; d=json.load(open(p)); d['alert']['sent']=True; json.dump(d, open(p,'w'), indent=1)"
      - name: Warn if market data has stopped updating
        if: fromJSON(steps.data.outputs.stale_days || '0') >= 5 && (github.event.schedule == '35 21 * * 1-5' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DAYS: ${{ steps.data.outputs.stale_days }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          printf 'The S&P 500 data used for the signal is %s days old, so a signal change could be missed. Check the Actions tab; until it recovers, check the S&P 500 and AVGS against their 150-day averages yourself (OFF only when both are below).\n' "$DAYS" > body.md
          bash scripts/notify.sh "Tracker: market data is $DAYS days old" "The signal can't update until this is fixed. Check the Actions tab on GitHub." high warning "Market data is $DAYS days old" body.md
      - name: Commit data
        if: always() && steps.data.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Update market data"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
      - name: Tell you if this job breaks
        if: failure() && (github.event.schedule == '35 21 * * 1-5' || github.event_name == 'workflow_dispatch')
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] && curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -H "Title: Tracker data job failed" -H "Priority: high" -H "Tags: warning" \
            -H "Click: $RUN" -d "Today's market update failed. Tap to see why. GitHub also emails you about failed runs." "https://ntfy.sh/$NTFY_TOPIC" || true
