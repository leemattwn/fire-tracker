name: Update market data

on:
  schedule:
    - cron: "35 21 * * 1-5"   # 05:35 Hong Kong, after the US close
    - cron: "50 16 * * 1-5"   # 00:50 Hong Kong, after the London close
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_data.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices and compute the signal
        id: data
        run: python scripts/update_data.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Update market data"
          git pull --rebase
          git push
      - name: Notify when the signal flips
        if: steps.data.outputs.flip != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FLIP: ${{ steps.data.outputs.flip }}
          WHEN: ${{ steps.data.outputs.date }}
          DETAIL: ${{ steps.data.outputs.detail }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$FLIP" = "OFF" ]; then
            ACTION="Sell your small-value funds (AVUV, AVGS, USSC) and buy IB01. While you're studying, only if your small-value funds are over US\$1,500."
          else
            ACTION="Sell your parked IB01 and buy back small value (the tracker shows which fund)."
          fi
          printf '@%s The market signal turned **%s** at the close on %s.\n\n%s\n\n**What to do:** %s\n\nOpen the tracker: %s\n' \
            "$OWNER" "$FLIP" "$WHEN" "$DETAIL" "$ACTION" "$SITE" > body.md
          gh issue create --title "Signal $FLIP on $WHEN" --body-file body.md
