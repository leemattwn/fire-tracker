name: Check the backup data source (one-off)
on:
  push:
    paths: [".github/workflows/probe-backup.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          mkdir -p probe
          python3 - <<'PY' > probe/backup.txt
          import importlib.util, json
          spec = importlib.util.spec_from_file_location("u", "scripts/update_data.py"); u = importlib.util.module_from_spec(spec); spec.loader.exec_module(u)
          _, y = u.yahoo("^GSPC", closed_only=True); s = u.stooq_spx()
          sy, ss = u.signal(y), u.signal(s)
          print("yahoo last", y[-1], "stooq last", s[-1])
          for k in ("date", "close", "sma200", "vol20", "raw", "on", "since"): print(k, sy[k], ss[k])
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "backup check" && git pull --rebase && git push
