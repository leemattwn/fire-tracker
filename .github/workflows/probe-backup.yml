name: Check the backup data source (one-off)
on:
  push:
    paths: [".github/workflows/probe-backup.yml"]   # v4
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          python3 - <<'PY' > probe/backup.txt
          import importlib.util, traceback
          spec = importlib.util.spec_from_file_location("u", "scripts/update_data.py"); u = importlib.util.module_from_spec(spec); spec.loader.exec_module(u)
          try:
              _, y = u.yahoo("^GSPC", closed_only=True); b = u.backup_spx(); sy, sb = u.signal(y), u.signal(b)
              print("yahoo last", y[-1], "| backup last", b[-1], "| rows", len(y), len(b))
              for k in ("date", "close", "sma200", "vol20", "raw", "on"): print(k, sy[k], sb[k])
          except Exception: print(traceback.format_exc()[-500:])
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "backup check" && git pull --rebase && git push
